server:
  port: 8080  

spring:
  application:
    name: dbms-backend

# DBMS 原生二进制存储引擎配置
dbms:
  engine:
    # 引擎能力开关
    capabilities:
      schema: true
      table: true
      record: true
      index: true
      constraint: true
      transaction: true
      security: true
      backup: true
    # 底层存储文件配置（对应验收要求 3.12.x）
    storage:
      system-schema-name: errDB       # 系统数据库名称（默认 errDB，不可删除）
      global-db-file-name: errDB.db  # 全局数据库注册表文件名
      data-dir-name: data             # 数据库数据文件夹名
      dbms-root: ""                   # DBMS 根目录，空表示使用程序运行目录 (System.getProperty("user.dir"))
      auto-create-system-schema: true  # 自动创建系统数据库

logging:
  level:
    org.springframework.jdbc: DEBUG
